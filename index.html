<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Manajemen Lapangan Telekomunikasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap');
        
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        .dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }
        
        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
            -webkit-tap-highlight-color: transparent;
        }
        
        .bg-primary { background-color: var(--bg-primary); }
        .bg-secondary { background-color: var(--bg-secondary); }
        .bg-tertiary { background-color: var(--bg-tertiary); }
        .text-primary { color: var(--text-primary); }
        .text-secondary { color: var(--text-secondary); }
        .text-muted { color: var(--text-muted); }
        .border-theme { border-color: var(--border-color); }
        .shadow-sm { box-shadow: var(--shadow-sm); }
        .shadow-md { box-shadow: var(--shadow-md); }
        .shadow-lg { box-shadow: var(--shadow-lg); }
        .shadow-xl { box-shadow: var(--shadow-xl); }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { 
            background: var(--border-color); 
            border-radius: 10px; 
        }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        
        .glass {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
        }
        
        .dark .dark\:bg-slate-900 { background-color: #0f172a !important; }
        .dark .dark\:bg-slate-800 { background-color: #1e293b !important; }
        .dark .dark\:bg-slate-700 { background-color: #334155 !important; }
        .dark .dark\:text-slate-200 { color: #e2e8f0 !important; }
        .dark .dark\:text-slate-300 { color: #cbd5e1 !important; }
        .dark .dark\:text-slate-400 { color: #94a3b8 !important; }
        .dark .dark\:border-slate-700 { border-color: #334155 !important; }
        .dark .dark\:border-slate-800 { border-color: #1e293b !important; }

        /* ================= MOBILE-FIRST UX ================= */
        html, body { width: 100%; min-height: 100%; overflow-x: hidden; }
        button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
        input, select, textarea { min-height: 44px; font-size: 16px !important; }
        button { min-height: 44px; }
        #content-area { overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; }
        #mobile-bottom-nav { display: none; }
        .mobile-only { display:none; }

        @media (max-width: 1023px) {
            body { padding-bottom: env(safe-area-inset-bottom); }
            #main-app { min-height: 100dvh !important; height: 100dvh; }
            #app-sidebar { width: min(82vw, 320px); }
            #content-area { padding: 12px !important; padding-bottom: calc(84px + env(safe-area-inset-bottom)) !important; }
            #main-app > main { height: 100dvh; min-height: 0; }
            header { min-height: 60px; padding-top: max(10px, env(safe-area-inset-top)); }
            header h2 { max-width: 55vw; font-size: 14px; }
            #salary-badge { display: none !important; }
            #theme-toggle { top: max(10px, env(safe-area-inset-top)); right: 10px; }
            #theme-toggle { position: fixed; transform: scale(.9); }

            /* Form cards */
            #content-area > div > .grid,
            #content-area .grid.grid-cols-1 { gap: 12px !important; }
            #content-area .bg-white { border-radius: 16px !important; }
            #content-area form { gap: 0; }
            #content-area label { font-size: 10px !important; margin-bottom: 5px !important; }
            #content-area input, #content-area select, #content-area textarea { width:100%; border-radius: 12px !important; }
            #content-area textarea { min-height: 88px; }

            /* Horizontal grids collapse cleanly */
            #content-area .grid.grid-cols-2,
            #content-area .grid.grid-cols-4 { grid-template-columns: 1fr !important; }
            #content-area .grid.grid-cols-4 > .col-span-3 { grid-column: auto !important; }

            /* Action bars */
            #content-area .flex.items-center.gap-2 { flex-wrap: wrap; }
            #content-area .flex.items-center.gap-2 > button,
            #content-area .flex.flex-col.sm\:flex-row > button { min-height: 44px; }

            /* Data tables become touch-friendly cards */
            #content-area table { border-collapse: separate !important; border-spacing: 0 10px !important; width:100% !important; }
            #content-area table thead { display:none !important; }
            #content-area table tbody,
            #content-area table tr,
            #content-area table td { display:block !important; width:100% !important; }
            #content-area table tbody tr {
                background: var(--bg-secondary);
                border: 1px solid var(--border-color);
                border-radius: 16px;
                box-shadow: var(--shadow-sm);
                overflow:hidden;
                padding: 7px 12px;
                margin-bottom: 10px;
            }
            #content-area table td {
                border:0 !important;
                padding: 8px 0 !important;
                white-space: normal !important;
                text-align:right !important;
                min-height: 36px;
                display:flex !important;
                align-items:center;
                justify-content:space-between;
                gap:12px;
                font-size: 12px !important;
            }
            #content-area table td::before {
                content: attr(data-label);
                color: var(--text-muted);
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing:.04em;
                text-align:left;
                flex: 0 0 42%;
            }
            #content-area table td:first-child { border-top:0 !important; }
            #content-area table td:last-child { padding-bottom:10px !important; }
            #content-area table td > * { max-width:58%; }
            #content-area table td input,
            #content-area table td select,
            #content-area table td button { max-width:58%; min-height:40px; }
            #content-area table td:has(input[type="checkbox"]) { justify-content:flex-start; }
            #content-area table td:has(input[type="checkbox"])::before { flex:1; }

            /* Hide non-essential horizontal-scroll wrappers on mobile */
            #content-area .overflow-x-auto { overflow:visible !important; margin-left:0 !important; margin-right:0 !important; }
            #content-area .overflow-x-auto > div { min-width:0 !important; width:100% !important; padding-left:0 !important; padding-right:0 !important; }

            /* Tombol Logout tetap / independen: berlaku untuk Admin dan User */
            #mobile-logout-fixed {
                display:flex !important;
                position:fixed;
                right:12px;
                bottom:calc(76px + env(safe-area-inset-bottom));
                z-index:60;
                min-height:46px;
                padding:8px 14px;
                border:1px solid #fecaca;
                border-radius:14px;
                background:#fff1f2;
                color:#dc2626;
                box-shadow:0 6px 20px rgba(15,23,42,.15);
                align-items:center;
                justify-content:center;
                gap:7px;
                font-size:11px;
                font-weight:800;
            }
            #mobile-logout-fixed i { font-size:15px; }
            .dark #mobile-logout-fixed {
                background:#450a0a;
                border-color:#7f1d1d;
                color:#fca5a5;
            }

            /* Bottom navigation */
            #mobile-bottom-nav {
                display:flex;
                position:fixed;
                left:0; right:0; bottom:0;
                z-index:45;
                min-height:64px;
                padding:6px 8px max(6px, env(safe-area-inset-bottom));
                background:rgba(255,255,255,.94);
                border-top:1px solid var(--border-color);
                backdrop-filter:blur(16px);
                -webkit-backdrop-filter:blur(16px);
                box-shadow:0 -6px 20px rgba(15,23,42,.08);
                justify-content:space-around;
                gap:4px;
            }
            .dark #mobile-bottom-nav { background:rgba(15,23,42,.94); }
            #mobile-bottom-nav button {
                flex:1;
                min-width:0;
                border-radius:14px;
                color:var(--text-muted);
                background:transparent;
                display:flex;
                flex-direction:column;
                align-items:center;
                justify-content:center;
                gap:3px;
                font-size:9px;
                font-weight:700;
                line-height:1.1;
                padding:4px 2px;
            }
            #mobile-bottom-nav button i { font-size:16px; }
            #mobile-bottom-nav button.active { color:#2563eb; background:#eff6ff; }
            .dark #mobile-bottom-nav button.active { color:#60a5fa; background:#172554; }

            /* Full-screen edit/image dialogs */
            #modal-edit-universal { padding:0 !important; align-items:flex-end !important; }
            #modal-edit-universal > div {
                width:100% !important; max-width:none !important;
                max-height:92dvh; overflow-y:auto;
                border-radius:22px 22px 0 0 !important;
                padding:16px !important;
            }
            #modal-edit-universal .flex.justify-end { position:sticky; bottom:0; background:var(--bg-secondary); padding-top:12px; }
            #modal-edit-universal .flex.justify-end button { flex:1; }
            #modal-image-preview { padding:10px !important; }
            #modal-image-preview > div { border-radius:18px !important; padding:10px !important; }
            #modal-image-preview img { max-height:82dvh !important; }

            /* Larger, easier touch targets for photo uploads */
            input[type="file"] { min-height:48px; padding:8px 4px; }
            input[type="file"]::file-selector-button { min-height:36px; border-radius:10px; }
        }

        @media (min-width: 1024px) {
            #mobile-bottom-nav { display:none !important; }
            #mobile-logout-fixed { display:none !important; }
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white">
    <!-- Tombol Pengalih Tema -->
    <button id="theme-toggle" class="fixed top-4 right-4 z-50 p-3 rounded-full bg-secondary border-theme border shadow-md hover:shadow-lg transition-all duration-300 group">
        <i class="fa-solid fa-moon text-amber-500 group-hover:scale-110 transition-transform" id="theme-icon"></i>
    </button>

    <div id="auth-page" class="min-h-screen flex items-center justify-center p-4 bg-primary">
        <div class="bg-secondary p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md border-theme border fade-in">
            <div class="text-center mb-8">
                <div class="bg-gradient-to-br from-blue-500 to-blue-700 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-lg shadow-blue-200/50 dark:shadow-blue-900/30 mb-4">
                    <i class="fa-solid fa-tower-cell"></i>
                </div>
                <h2 class="text-2xl font-bold text-primary" id="auth-title">ARWANA SYNERGY</h2>
                <p class="text-muted text-sm mt-2">Sistem Manajemen Lapangan Telekomunikasi</p>
            </div>
            
            <form id="auth-form" class="space-y-4">
                <div id="register-fields" class="hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-2">Nama Lengkap</label>
                    <input type="text" id="auth-nama" class="w-full px-4 py-3 rounded-xl border-theme border bg-tertiary/50 text-primary text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-2">Email Address</label>
                    <input type="email" id="auth-email" required="" 
  class="w-full px-4 py-3 rounded-xl border-theme border bg-tertiary text-primary text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
  style="color: #ffffff !important; background-color: #2a3b5c !important;">
                </div>
                <div id="password-field">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-2">Password</label>
                    <input type="password" id="auth-password" required="" minlength="6" 
  class="w-full px-4 py-3 rounded-xl border-theme border bg-tertiary text-primary text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all" 
  placeholder="Minimal 6 karakter">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full btn-primary text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-blue-200/50 dark:shadow-blue-900/30 mt-4 text-sm active:scale-[0.98] hover:scale-[1.01]">Masuk</button>
            </form>
            
            <div class="text-center mt-8 text-sm space-y-3">
                <button id="toggle-auth" type="button" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline transition-colors">Belum punya akun? Daftar disini</button>
                <br>
                <button id="toggle-forgot-password" type="button" class="text-amber-600 dark:text-amber-400 font-semibold hover:underline transition-colors">Lupa Password?</button>
            </div>
        </div>
    </div>

    <!-- Halaman Lupa Password -->
    <div id="forgot-password-page" class="min-h-screen flex items-center justify-center p-4 bg-primary hidden">
        <div class="bg-secondary p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md border-theme border fade-in">
            <div class="text-center mb-8">
                <div class="bg-gradient-to-br from-amber-500 to-amber-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-lg shadow-amber-200/50 dark:shadow-amber-900/30 mb-4">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="text-2xl font-bold text-primary">Lupa Password</h2>
                <p class="text-muted text-sm mt-2">Masukkan email Anda untuk menerima tautan reset password</p>
            </div>
            
            <form id="forgot-password-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-2">Email Terdaftar</label>
                    <input type="email" id="forgot-email" required class="w-full px-4 py-3 rounded-xl border-theme border bg-tertiary/50 text-primary text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 transition-all">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-amber-200/50 dark:shadow-amber-900/30 mt-4 text-sm active:scale-[0.98]">Kirim Tautan Reset</button>
            </form>
            
            <div class="text-center mt-8 text-sm">
                <button id="back-to-login" type="button" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline transition-colors">← Kembali ke Halaman Masuk</button>
            </div>
        </div>
    </div>

    <!-- Halaman Reset Password -->
    <div id="reset-password-page" class="min-h-screen flex items-center justify-center p-4 bg-primary hidden">
        <div class="bg-secondary p-6 sm:p-8 rounded-3xl shadow-xl w-full max-w-md border-theme border fade-in">
            <div class="text-center mb-8">
                <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold shadow-lg shadow-emerald-200/50 dark:shadow-emerald-900/30 mb-4">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-primary">Buat Password Baru</h2>
                <p class="text-muted text-sm mt-2">Masukkan password baru untuk akun Anda</p>
            </div>
            
            <form id="reset-password-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-2">Password Baru</label>
                    <input type="password" id="new-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border-theme border bg-tertiary/50 text-primary text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all" placeholder="Minimal 6 karakter">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-secondary mb-2">Konfirmasi Password Baru</label>
                    <input type="password" id="confirm-new-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border-theme border bg-tertiary/50 text-primary text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all" placeholder="Ulangi password baru">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-700 hover:to-emerald-800 text-white font-semibold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-emerald-200/50 dark:shadow-emerald-900/30 mt-4 text-sm active:scale-[0.98]">Simpan Password Baru</button>
            </form>
        </div>
    </div>

    <!-- Aplikasi Utama -->
    <div id="main-app" class="hidden min-h-screen flex relative bg-primary">
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden transition-opacity duration-300 opacity-0" onclick="toggleMobileSidebar()"></div>
        <aside id="app-sidebar" class="fixed inset-y-0 left-0 w-64 dark:bg-slate-900 bg-slate-900/95 text-slate-300 p-4 flex flex-col justify-between flex-shrink-0 z-50 transform -translate-x-full transition-transform duration-300 lg:translate-x-0 lg:static lg:h-screen glass">
            <div>
                <div class="flex items-center justify-between px-2 py-4 mb-6 border-b dark:border-slate-800 border-slate-800/50">
                    <div class="flex items-center gap-3">
                        <div class="bg-gradient-to-br from-blue-500 to-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-900/20"><i class="fa-solid fa-hard-drive"></i></div>
                        <div>
                            <h1 class="text-white font-bold text-sm leading-tight max-w-[130px] truncate" id="user-display-name">Memuat...</h1>
                            <span class="text-[10px] bg-blue-900/40 px-2 py-0.5 rounded text-blue-300 font-bold" id="user-display-role">USER</span>
                        </div>
                    </div>
                    <button onclick="toggleMobileSidebar()" class="text-slate-400 hover:text-white lg:hidden p-2 rounded-lg hover:bg-slate-800 transition-colors">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <nav class="space-y-1.5" id="sidebar-menu"></nav>
            </div>
            <div class="pt-4 border-t dark:border-slate-800 border-slate-800/50 mt-4">
                <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-red-400 hover:bg-red-950/40 font-medium text-sm transition-all duration-200 group">
                    <i class="fa-solid fa-arrow-right-from-bracket group-hover:translate-x-0.5 transition-transform"></i> Keluar Sistem
                </button>
            </div>
        </aside>

        <main class="flex-1 min-w-0 flex flex-col h-screen overflow-hidden">
            <header class="bg-secondary border-theme border-b px-4 lg:px-6 py-4 flex items-center justify-between flex-shrink-0 shadow-sm z-30">
                <div class="flex items-center gap-3">
                    <button onclick="toggleMobileSidebar()" class="bg-tertiary/50 hover:bg-tertiary text-secondary p-2.5 rounded-xl lg:hidden transition-all border-theme border active:scale-95" title="Buka Menu">
                        <i class="fa-solid fa-bars text-sm"></i>
                    </button>
                    <h2 class="text-base font-bold text-primary truncate" id="current-menu-title">Dashboard</h2>
                </div>
                <div class="flex items-center gap-3">
                    <span id="salary-badge" class="text-[10px] sm:text-xs bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-400 px-3 py-1.5 rounded-full font-bold border border-emerald-100 dark:border-emerald-900/30 hidden">
                    </span>
                    <button onclick="refreshMenuAktif()" class="bg-tertiary/50 text-secondary border-theme border p-2.5 rounded-xl hover:bg-blue-50 dark:hover:bg-blue-950/30 hover:text-blue-600 dark:hover:text-blue-400 transition-all active:scale-95" title="Refresh Data">
                        <i class="fa-solid fa-arrows-rotate text-sm"></i>
                    </button>
                </div>
            </header>
            <div class="p-4 lg:p-6 overflow-y-auto flex-1 bg-primary custom-scroll" id="content-area"></div>
        </main>
    </div>

    <!-- Navigasi bawah khusus HP -->
    <nav id="mobile-bottom-nav" aria-label="Navigasi utama mobile"></nav>

    <!-- Logout HP: tombol berdiri sendiri agar selalu tampil untuk ADMIN maupun USER -->
    <button id="mobile-logout-fixed" type="button" onclick="handleLogout()" aria-label="Keluar Sistem">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span>Keluar</span>
    </button>

    <!-- Modal Edit Universal -->
    <div id="modal-edit-universal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm items-center justify-center p-4 hidden flex">

        // ===== PENGATURAN TEMA =====
        const htmlElement = document.documentElement;

        // Muat tema tersimpan
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        }
        
        function setTheme(theme) {
            if (theme === 'dark') {
                htmlElement.classList.remove('light');
                htmlElement.classList.add('dark');
                themeIcon.classList.remove('fa-moon', 'text-amber-500');
                themeIcon.classList.add('fa-sun', 'text-yellow-400');
            } else {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light');
                themeIcon.classList.remove('fa-sun', 'text-yellow-400');
                themeIcon.classList.add('fa-moon', 'text-amber-500');
            }
            localStorage.setItem('theme', theme);
        }
        
        function toggleTheme() {
            const isDark = htmlElement.classList.contains('dark');
            setTheme(isDark ? 'light' : 'dark');
        }
        
        // Inisialisasi tema
        loadTheme();
        themeToggle.addEventListener('click', toggleTheme);

        // ===== KONFIGURASI SUPABASE =====

        let currentUser = null;

        // ======================================
        // FUNGSI LUPA & RESET PASSWORD
        // ======================================
        function periksaParameterResetPassword() {
            const hash = window.location.hash;
            if (hash.includes('type=recovery')) {
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('forgot-password-page').classList.add('hidden');
                document.getElementById('reset-password-page').classList.remove('hidden');
            }
        }
        
        async function prosesLupaPassword(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + window.location.pathname
                });
                if (error) throw error;
                alert("✅ Tautan reset password telah dikirim ke email Anda. Silakan cek kotak masuk atau folder spam.");
                document.getElementById('forgot-password-form').reset();
            } catch (err) {
                alert("❌ Gagal mengirim tautan: " + err.message);
            }
        }
        
        async function prosesResetPassword(e) {
            e.preventDefault();
            const passBaru = document.getElementById('new-password').value;
            const passKonfirm = document.getElementById('confirm-new-password').value;
            if (passBaru !== passKonfirm) {
                alert("⚠️ Password baru dan konfirmasi tidak cocok!");
                return;
            }
            if (passBaru.length < 6) {
                alert("⚠️ Password minimal 6 karakter!");
                return;
            }
            try {
                const { error } = await supabase.auth.updateUser({ password: passBaru });
                if (error) throw error;
                alert("✅ Password berhasil diperbarui! Anda akan diarahkan ke halaman login.");
                window.location.hash = '';
                window.location.reload();
            } catch (err) {
                alert("❌ Gagal memperbarui password: " + err.message);
            }
        }

        // ======================================
        // AKHIR FUNGSI BARU
        // ======================================

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('app-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (!sidebar || !overlay) return;
            
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.add('opacity-100'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.remove('opacity-100');
                setTimeout(() => overlay.classList.add('hidden'), 30);
            }
        }

        function setupEventListeners() {
            document.getElementById('auth-form').addEventListener('submit', prosesAutentikasi);
            document.getElementById('form-edit-universal').addEventListener('submit', eksekusiUpdateDataMenu);
            document.getElementById('toggle-auth').addEventListener('click', () => {
                isRegisterMode = !isRegisterMode;
                document.getElementById('auth-title').innerText = isRegisterMode ? "Daftar Akun" : "ARWANA SYNERGY";
                document.getElementById('auth-submit-btn').innerText = isRegisterMode ? "Daftar" : "Masuk";
                document.getElementById('register-fields').classList.toggle('hidden', !isRegisterMode);
                document.getElementById('auth-nama').required = isRegisterMode;
                document.getElementById('toggle-auth').innerText = isRegisterMode ? "Sudah punya akun? Login" : "Belum punya akun? Daftar disini";
            });

            // Event Lupa Password
            document.getElementById('toggle-forgot-password').addEventListener('click', () => {
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('forgot-password-page').classList.remove('hidden');
            });
            document.getElementById('back-to-login').addEventListener('click', () => {
                document.getElementById('forgot-password-page').classList.add('hidden');
                document.getElementById('auth-page').classList.remove('hidden');
            });
            document.getElementById('forgot-password-form').addEventListener('submit', prosesLupaPassword);
            document.getElementById('reset-password-form').addEventListener('submit', prosesResetPassword);
        }

        async function periksaSesiLogin() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session?.user) ambilProfilDanMasuk(session.user);
            } catch(e) { console.error("Session check error", e); }
        }

        async function prosesAutentikasi(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const nama = document.getElementById('auth-nama').value;
            try {
                if (isRegisterMode) {
                    const { error } = await supabase.auth.signUp({ email, password, options: { data: { nama } } });
                    if (error) throw error;
                    alert("Registrasi sukses! Silakan hubungi admin utama untuk aktivasi akun.");
                    document.getElementById('toggle-auth').click();
                    document.getElementById('auth-form').reset();
                } else {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    if (data?.user) ambilProfilDanMasuk(data.user);
                }
            } catch (err) { alert("Sistem Menolak: " + err.message); }
        }

        async function ambilProfilDanMasuk(user) {
            try {
                const { data: profile, error } = await supabase.from('profiles').select('*').eq('id', user.id).maybeSingle();
                if (error) throw error;
                if (!profile) { alert("Profil tidak ditemukan."); await supabase.auth.signOut(); return; }
                if (profile.role !== 'admin' && !profile.status_acc) {
                    alert("Akun Anda belum di-ACC oleh Admin."); await supabase.auth.signOut(); return;
                }
                currentUser = user;
                profileData = profile;
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-display-name').innerText = profileData.nama;
                document.getElementById('user-display-role').innerText = profileData.role.toUpperCase();

                if (profileData.role === 'user') {
                    const badge = document.getElementById('salary-badge');
                    if (badge) {
                        badge.classList.remove('hidden');
                        badge.innerText = `Rp ${Number(profileData.salary_per_hari || 0).toLocaleString('id-ID')}/Hr`;
                    }
                }
                renderSidebarMenu();
                renderMobileBottomNav();
                setupMobileUX();
                pindahMenu('dashboard');
            } catch (err) { alert("Error Profiling: " + err.message); }
        }


        function setupMobileUX() {
            const content = document.getElementById('content-area');
            if (!content || content.dataset.mobileUxReady) return;
            content.dataset.mobileUxReady = '1';

            const labelTables = () => {
                content.querySelectorAll('table').forEach(table => {
                    const headers = Array.from(table.querySelectorAll('thead th')).map(th => th.innerText.trim());
                    table.querySelectorAll('tbody tr').forEach(row => {
                        Array.from(row.children).forEach((td, i) => {
                            if (!td.dataset.label && headers[i]) td.dataset.label = headers[i];
                        });
                    });
                });
            };
            new MutationObserver(labelTables).observe(content, {childList:true, subtree:true});
            labelTables();
        }

        function renderMobileBottomNav() {
            const nav = document.getElementById('mobile-bottom-nav');
            if (!nav || !profileData) return;
            const userMenus = baseMenus.filter(m => m.role === 'all' || m.role === profileData.role);
            // Di HP, tombol Keluar dibuat selalu terlihat agar pengguna tidak perlu
            // membuka sidebar hanya untuk logout. Menu lain tetap tersedia di sidebar.
            const preferred = ['dashboard','absensi','ops','progres_node_b'];
            let items = preferred.map(id => userMenus.find(m => m.id === id)).filter(Boolean);
            items = items.slice(0,4);
            nav.innerHTML = items.map(m => `
                <button type="button" id="mobile-nav-${m.id}" onclick="pindahMenu('${m.id}')">
                    <i class="fa-solid ${m.icon}"></i><span>${m.name.replace(' Team','').replace(' Node-B','')}</span>
                </button>`).join('');
            updateMobileBottomNav();
        }

        function updateMobileBottomNav() {
            document.querySelectorAll('#mobile-bottom-nav button').forEach(btn => btn.classList.remove('active'));
            const active = document.getElementById(`mobile-nav-${menuAktifSaatIni}`);
            if (active) active.classList.add('active');
        }

        function renderSidebarMenu() {
            const container = document.getElementById('sidebar-menu');
            if (!container) return;
            const userMenus = baseMenus.filter(m => m.role === 'all' || m.role === profileData.role);
            container.innerHTML = userMenus.map(m => `
                <button onclick="pindahMenu('${m.id}')" id="menu-btn-${m.id}" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition duration-150 hover:bg-slate-800 hover:text-white active:scale-[0.98]">
                    <i class="fa-solid ${m.icon} w-5 text-center text-xs"></i> <span>${m.name}</span>
                </button>
            `).join('');
        }

        function pindahMenu(menuId) {
            const targetMenu = baseMenus.find(m => m.id === menuId);
            if (targetMenu && targetMenu.role === 'admin' && profileData.role !== 'admin') {
                alert("Akses Ditolak! Khusus Admin.");
                return;
            }
            menuAktifSaatIni = menuId;
            baseMenus.forEach(m => {
                const btn = document.getElementById(`menu-btn-${m.id}`);
                if (btn) btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
            });
            const actBtn = document.getElementById(`menu-btn-${menuId}`);
            if (actBtn) actBtn.classList.add('bg-blue-600', 'text-white', 'shadow-md');
            updateMobileBottomNav();
            
            const titleElem = document.getElementById('current-menu-title');
            if (titleElem) titleElem.innerText = targetMenu.name;
            
            const sidebar = document.getElementById('app-sidebar');
            if(sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
                toggleMobileSidebar();
            }

            bukaKontenHalaman(menuId);
        }

        function refreshMenuAktif() {
            bukaKontenHalaman(menuAktifSaatIni);
        }

        function togglePilihSemua(masterCheckbox, className) {
            const checkboxes = document.querySelectorAll(`.${className}`);
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
        }

        async function hapusDataTerpilih(namaTabel, className) {
            const checkboxes = document.querySelectorAll(`.${className}:checked`);
            if (checkboxes.length === 0) {
                alert("Pilih minimal satu data untuk dihapus.");
                return;
            }
            if (!confirm(`Apakah Anda yakin ingin menghapus ${checkboxes.length} data terpilih secara permanen?`)) return;
            
            const idsTohapus = Array.from(checkboxes).map(cb => Number(cb.value));
            try {
                const { error } = await supabase.from(namaTabel).delete().in('id', idsTohapus);
                if (error) throw error;
                alert("Data terpilih berhasil dihapus!");
                refreshMenuAktif();
            } catch (err) { alert("Gagal menghapus data masal: " + err.message); }
        }

        // Fungsi bantu konversi file foto ke string base64
        function dapatkanBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

            if(!base64Data) { alert("Foto bukti tidak tersedia."); return; }
            document.getElementById('img-preview-target').src = base64Data;

        }

        function hitungSimulasiOPM() {
    const jarak = parseFloat(document.getElementById('sim-dist').value) || 0;
    const kalibrasi = parseFloat(document.getElementById('sim-kal').value) || 0;
    const conn = parseFloat(document.getElementById('sim-conn').value) || 0;
    const splice = parseFloat(document.getElementById('sim-splice').value) || 0;
    const tipe = document.getElementById('sim-tipe').value;

    const redamanKabel = tipe === '1310' ? 0.35 : 0.23;
    const total = (jarak * redamanKabel) + kalibrasi + (conn * 0.35) + (splice * 0.1);

    const hasilDiv = document.getElementById('sim-hasil');
    hasilDiv.classList.remove('hidden');
    hasilDiv.innerText = `Total Nilai OPM: ${total.toFixed(2)} dB`;
}

            const fieldsContainer = document.getElementById('modal-edit-fields');
            const inputs = fieldsContainer.querySelectorAll('input, select, textarea');
            
            let payload = {};
            inputs.forEach(input => {

                if (value === '') value = null;
                payload[key] = value;

                alert("Data lapangan berhasil diperbarui!");
                tutupModalEdit();

        async function hitungDanMuatDashboard() {
            try {
                const isAdmin = profileData.role === 'admin';
                
                if (isAdmin) {
                    const [resProfiles, resAbsensi, resKasbon, resOps] = await Promise.all([
                        supabase.from('profiles').select('*').eq('role', 'user'),
                        supabase.from('absensi').select('user_id, status_hadir'),
                        supabase.from('kasbon').select('user_id, nominal'),
                        supabase.from('operasional').select('tipe, jumlah, qty')
                    ]);

                    const profiles = resProfiles.data || [];
                    const logAbsen = resAbsensi.data || [];
                    const logKasbon = resKasbon.data || [];

                    let totalSalaryKolektifAdmin = 0;
                    profiles.forEach(p => {
                        const hadir = logAbsen.filter(a => a.user_id === p.id && a.status_hadir === 'Hadir').length;
                        const kasbonBerjalan = logKasbon.filter(k => k.user_id === p.id).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
                        
                        const salaryplay = Number(p.salary_per_hari || 0);
                        const insentif = Number(p.insentif || 0);
                        const totalSalaryKotor = (hadir * salaryplay) + insentif;
                        
                        const cicilan = Number(p.cicilan_per_bulan || 0);
                        const salaryAkhirBersih = totalSalaryKotor - kasbonBerjalan - cicilan;
                        totalSalaryKolektifAdmin += (salaryAkhirBersih > 0 ? salaryAkhirBersih : 0);
                    });

                    const salEle = document.getElementById('dash-total-salary');
                    if(salEle) salEle.innerText = `Rp ${totalSalaryKolektifAdmin.toLocaleString('id-ID')}`;

                    const totalHadirAdmin = logAbsen.filter(d => d.status_hadir === 'Hadir').length;
                    const abEle = document.getElementById('dash-absen');
                    if(abEle) abEle.innerText = `${totalHadirAdmin} Hari`;

                    let totalMasukOps = 0, totalKeluarOps = 0;
                    (resOps.data || []).forEach(item => {
                        const uang = Number(item.jumlah || 0);
                        const qty = Number(item.qty || 1);
                        if (item.tipe === 'Masuk') totalMasukOps += uang;
                        else totalKeluarOps += (uang * qty);
                    });
                    const opsEle = document.getElementById('dash-sisa-ops');
                    if(opsEle) opsEle.innerText = `Rp ${Number(totalMasukOps - totalKeluarOps).toLocaleString('id-ID')}`;

                    let totalKasbonKolektif = 0;
                    logKasbon.forEach(item => totalKasbonKolektif += Number(item.nominal || 0));
                    const kbEle = document.getElementById('dash-kasbon-bulan');
                    if(kbEle) kbEle.innerText = `Rp ${totalKasbonKolektif.toLocaleString('id-ID')}`;

                    let totalSisaPinjamanKolektif = 0;
                    profiles.forEach(p => totalSisaPinjamanKolektif += Number(p.sisa_pinjaman || 0));
                    const plEle = document.getElementById('dash-total-kasbon');
                    if(plEle) plEle.innerText = `Rp ${totalSisaPinjamanKolektif.toLocaleString('id-ID')}`;

                } else {
                    let qAbsen = supabase.from('absensi').select('status_hadir').eq('user_id', currentUser.id);
                    let qOps = supabase.from('operasional').select('tipe, jumlah, qty').eq('user_id', currentUser.id);
                    let qKasbon = supabase.from('kasbon').select('nominal').eq('user_id', currentUser.id);

                    const [resAbsen, resOps, resKasbon] = await Promise.all([qAbsen, qOps, qKasbon]);

                    const totalHadir = (resAbsen.data || []).filter(d => d.status_hadir === 'Hadir').length;
                    const abEle = document.getElementById('dash-absen');
                    if(abEle) abEle.innerText = `${totalHadir} Hari`;

                    let totalMasukOps = 0, totalKeluarOps = 0;
                    (resOps.data || []).forEach(item => {
                        const uang = Number(item.jumlah || 0);
                        const qty = Number(item.qty || 1);
                        if (item.tipe === 'Masuk') totalMasukOps += uang;
                        else totalKeluarOps += (uang * qty);
                    });
                    const opsEle = document.getElementById('dash-sisa-ops');
                    if(opsEle) opsEle.innerText = `Rp ${Number(totalMasukOps - totalKeluarOps).toLocaleString('id-ID')}`;

                    let totalKasbon = 0;
                    (resKasbon.data || []).forEach(item => totalKasbon += Number(item.nominal || 0));
                    const kbEle = document.getElementById('dash-kasbon-bulan');
                    if(kbEle) kbEle.innerText = `Rp ${Number(totalKasbon).toLocaleString('id-ID')}`;

                    const sisaPinjaman = Number(profileData.sisa_pinjaman || 0);
                    const plEle = document.getElementById('dash-total-kasbon');
                    if(plEle) plEle.innerText = `Rp ${Number(sisaPinjaman).toLocaleString('id-ID')}`;

                    const salaryPerHari = Number(profileData.salary_per_hari || 0);
                    const insentif = Number(profileData.insentif || 0);
                    const cicilan = Number(profileData.cicilan_per_bulan || 0);
                    const totalGajiKotor = (totalHadir * salaryPerHari) + insentif;
                    const gajiBersih = totalGajiKotor - totalKasbon - cicilan;

                    const salEle = document.getElementById('dash-total-salary');
                    if(salEle) salEle.innerText = `Rp ${Number(gajiBersih > 0 ? gajiBersih : 0).toLocaleString('id-ID')}`;
                }

            } catch (err) { console.error("Dash error:", err.message); }
        }

        async function simpanAbsenAdmin(e) {
            e.preventDefault();
            try {
                const uid = document.getElementById('absen-user-id').value;
                const tgl = document.getElementById('absen-tgl').value;
                if (!uid) return alert('Pilih user terlebih dahulu.');
                const { data: prof, error: pe } = await supabase.from('profiles').select('nama').eq('id', uid).single();
                if (pe) throw pe;
                let lokasi = document.getElementById('absen-line').value;
                if (lokasi === 'MANUAL') lokasi = document.getElementById('absen-lokasi-manual').value.trim();
                const { data: existing, error: ce } = await supabase.from('absensi').select('id').eq('user_id', uid).eq('tanggal', tgl).maybeSingle();
                if (ce) throw ce;
                if (existing) return alert('User tersebut sudah memiliki absensi pada tanggal ini.');
                const { error } = await supabase.from('absensi').insert([{ user_id: uid, nama_user: prof.nama, tanggal: tgl, line_progres: lokasi, status_hadir: document.getElementById('absen-status').value, keterangan: document.getElementById('absen-ket').value }]);
                if (error) throw error;
                alert('Absensi user berhasil disimpan oleh admin!');
                refreshMenuAktif();
            } catch (err) { alert('Gagal input absensi admin: ' + err.message); }
        }

        function toggleInputManualLokasi(nilai) {
            const wadah = document.getElementById('container-lokasi-manual');
            const inputKetik = document.getElementById('absen-lokasi-manual');
            if(nilai === 'MANUAL') {
                wadah.classList.remove('hidden');
                inputKetik.required = true;

                wadah.classList.add('hidden');
                inputKetik.required = false;
                inputKetik.value = '';

        async function simpanAbsenUser(e) {
            e.preventDefault();
            try {
                const tglDipilih = document.getElementById('absen-tgl').value;
                
                // Validasi Aturan: User tidak boleh melakukan absensi ganda pada tanggal yang sama
                const { data: cekAbsen, error: errorCek } = await supabase
                    .from('absensi')
                    .select('id')
                    .eq('user_id', currentUser.id)
                    .eq('tanggal', tglDipilih)
                    .maybeSingle();
                
                if (errorCek) throw errorCek;
                if (cekAbsen) {
                    alert(`Gagal Kirim! Anda sudah tercatat melakukan absensi pada tanggal ${tglDipilih}. Anda tidak dapat absen dua kali pada hari yang sama.`);
                    return;
                }

                let lineProgresValue = document.getElementById('absen-line').value;
                if(lineProgresValue === 'MANUAL') {
                    lineProgresValue = document.getElementById('absen-lokasi-manual').value;
                }

                const payload = {
                    user_id: currentUser.id,
                    nama_user: profileData.nama,
                    tanggal: tglDipilih,
                    line_progres: lineProgresValue,
                    status_hadir: document.getElementById('absen-status').value,
                    keterangan: document.getElementById('absen-ket').value
                };

                const { error } = await supabase.from('absensi').insert([payload]);
                if (error) throw error;
                alert("Absensi berhasil terkirim!");
                refreshMenuAktif();
            } catch (err) { alert("Gagal absen: " + err.message); }
        }

        async function muatTabelAbsen(isAdmin) {
            try {
                const tbody = document.getElementById('tbody-absensi');
                if (!tbody) return;

                let query = supabase.from('absensi').select('*').order('tanggal', { ascending: false });
                if (!isAdmin) query = query.eq('user_id', currentUser.id);

                const { data, error } = await query;

        // ==================== FILTER OPERASIONAL BERDASARKAN USER PIC ====================
        let opsPICTerpilih = '';

        function escapeHtmlOps(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function isiFilterOpsPIC(data) {
            const select = document.getElementById('ops-filter-pic');
            if (!select) return;

            const picList = [...new Set(
                (data || [])
                    .map(d => (d.nama_user || '').trim())
                    .filter(Boolean)
            )].sort((a, b) => a.localeCompare(b, 'id'));

            const nilaiLama = opsPICTerpilih;

            select.innerHTML =
                '<option value="">Semua User PIC</option>' +
                picList.map(nama =>
                    `<option value="${escapeHtmlOps(nama)}">${escapeHtmlOps(nama)}</option>`
                ).join('');

            if (nilaiLama && picList.includes(nilaiLama)) {
                select.value = nilaiLama;
            } else {
                opsPICTerpilih = '';
                select.value = '';
            }
        }

        function filterOpsByPIC(namaPIC) {
            opsPICTerpilih = namaPIC || '';

            const dataTampil = opsPICTerpilih
                ? cacheOperasional.filter(d => (d.nama_user || '').trim() === opsPICTerpilih)
                : cacheOperasional;

            renderTabelOpsDanSaldo(dataTampil);

            const info = document.getElementById('ops-filter-info');
            if (info) {
                info.innerText = opsPICTerpilih
                    ? `Filter aktif: ${opsPICTerpilih}`
                    : 'Menampilkan semua User PIC';
            }
        }

        function renderTabelOpsDanSaldo(dataTampil) {
            const tbody = document.getElementById('tbody-ops');
            const boxSaldo = document.getElementById('ops-sisa-saldo');
            if (!tbody || !boxSaldo) return;

            const isAdmin = profileData.role === 'admin';
            let totalMasuk = 0;
            let totalKeluar = 0;

            tbody.innerHTML = (dataTampil || []).map(d => {
                const uang = Number(d.jumlah || 0);
                const qty = Number(d.qty || 1);

                if (d.tipe === 'Masuk') {
                    totalMasuk += uang;
                } else {
                    totalKeluar += uang * qty;
                }

                return `
                    <tr class="hover:bg-slate-50">
                        ${isAdmin ? `<td class="px-3 py-2.5 text-center"><input type="checkbox" value="${d.id}" class="cb-ops"></td>` : ''}
                        <td class="px-3 py-2.5">${d.tanggal}</td>
                        <td class="px-3 py-2.5 font-bold ${d.tipe === 'Masuk' ? 'text-green-600' : 'text-red-600'}">${d.tipe.toUpperCase()}</td>
                        <td class="px-3 py-2.5 text-slate-600 font-medium">${d.nama_user || '-'}</td>
                        <td class="px-3 py-2.5">${d.lokasi || '-'}</td>
                        <td class="px-3 py-2.5 text-slate-500">${d.deskripsi_item || '-'}</td>
                        <td class="px-3 py-2.5 font-medium">${qty}</td>
                        <td class="px-3 py-2.5 font-semibold text-slate-900">Rp ${uang.toLocaleString('id-ID')}</td>
                        ${cetakTombolAksiAdmin('operasional', d.id)}
                    </tr>
                `;
            }).join('');

            // SALDO MENGIKUTI FILTER USER PIC:
            // Sisa = total dana masuk PIC - total pengeluaran PIC.
            const sisa = totalMasuk - totalKeluar;
            boxSaldo.innerText = `Rp ${sisa.toLocaleString('id-ID')}`;

            boxSaldo.classList.toggle('text-red-600', sisa < 0);
            boxSaldo.classList.toggle('text-slate-900', sisa >= 0);
        }

                    supabase.from('kasbon').select('user_id, nominal')
                ]);

                const profiles = resProfiles.data || [];
                const logAbsen = resAbsensi.data || [];
                const logKasbon = resKasbon.data || [];

                tbody.innerHTML = profiles.map(p => {
                    const hadir = logAbsen.filter(a => a.user_id === p.id && a.status_hadir === 'Hadir').length;
                    const kasbonBerjalan = logKasbon.filter(k => k.user_id === p.id).reduce((sum, item) => sum + Number(item.nominal || 0), 0);
                    
                    const salaryPerHari = Number(p.salary_per_hari || 0);
                    const insentif = Number(p.insentif || 0);
                    const totalSalaryKotor = (hadir * salaryPerHari) + insentif;
                    
                    const totalPinjamanPlafon = Number(p.sisa_pinjaman || 0);
                    const cicilan = Number(p.cicilan_per_bulan || 0);
                    const sisaPinjamanPlafonAkhir = totalPinjamanPlafon - cicilan;
                    
                    const salaryAkhirBersih = totalSalaryKotor - kasbonBerjalan - cicilan;

                    return `
                        <tr class="hover:bg-slate-50 transition font-medium text-slate-700">
                            <td class="p-3 font-bold text-slate-900">${p.nama}</td>
                            <td class="p-3">${hadir} Hari</td>
                            <td class="p-3">Rp ${salaryPerHari.toLocaleString('id-ID')}</td>
                            <td class="p-3">Rp ${insentif.toLocaleString('id-ID')}</td>
                            <td class="p-3 text-emerald-600 font-bold">Rp ${totalSalaryKotor.toLocaleString('id-ID')}</td>
                            <td class="p-3 text-slate-400">Rp ${totalPinjamanPlafon.toLocaleString('id-ID')}</td>
                            <td class="p-3 text-red-500">Rp ${kasbonBerjalan.toLocaleString('id-ID')}</td>
                            <td class="p-3 text-amber-600">Rp ${cicilan.toLocaleString('id-ID')}</td>
                            <td class="p-3 text-slate-500">Rp ${(sisaPinjamanPlafonAkhir > 0 ? sisaPinjamanPlafonAkhir : 0).toLocaleString('id-ID')}</td>
                            <td class="p-3 bg-blue-50 text-blue-700 font-bold text-xs">Rp ${(salaryAkhirBersih > 0 ? salaryAkhirBersih : 0).toLocaleString('id-ID')}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) { console.error(err.message); }
        }

        function unduhExcelSpesifik(namaBerkas, dataSorce) {
            if(!dataSorce || dataSorce.length === 0) { alert("Tidak ada data untuk diexport."); return; }
            const worksheet = XLSX.utils.json_to_sheet(dataSorce);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data_Lapangan");
            XLSX.writeFile(workbook, `Laporan_${namaBerkas}_Field.xlsx`);
        }
    </script>
</body>
</html>
