<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Kata Sandi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        <div class="text-center mb-6">
            <i class="fa-solid fa-key text-3xl text-blue-600 mb-3"></i>
            <h2 class="text-xl font-bold text-slate-800">Buat Kata Sandi Baru</h2>
            <p class="text-sm text-slate-500 mt-1">Masukkan kata sandi baru untuk akun Anda</p>
        </div>

        <form id="form-ubah-sandi" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Kata Sandi Baru</label>
                <input type="password" id="sandi-baru" required minlength="6"
                    class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Konfirmasi Kata Sandi</label>
                <input type="password" id="konfirmasi-sandi" required minlength="6"
                    class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition active:scale-95">
                Simpan Kata Sandi
            </button>

            <div class="text-center mt-4">
                <a href="index.html" class="text-sm text-blue-600 hover:underline">Kembali ke Halaman Masuk</a>
            </div>
        </form>
    </div>

    <!-- Sertakan Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // === Konfigurasi Supabase ===
        const SUPABASE_URL = "https://uczqzarbuunjrkefdsdj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_3jk79pXdGHa88negFx1TGw_z2JnHnrO";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // === Proses Simpan Kata Sandi Baru ===
        document.getElementById('form-ubah-sandi').addEventListener('submit', async function(e) {
            e.preventDefault();

            const sandiBaru = document.getElementById('sandi-baru').value.trim();
            const konfirmasi = document.getElementById('konfirmasi-sandi').value.trim();

            // Validasi
            if (sandiBaru !== konfirmasi) {
                alert("❌ Kata sandi tidak cocok! Silakan ketik ulang.");
                return;
            }

            if (sandiBaru.length < 6) {
                alert("❌ Kata sandi minimal 6 karakter!");
                return;
            }

            // Kirim perubahan ke Supabase
            const { error } = await supabase.auth.updateUser({ password: sandiBaru });

            if (error) {
                alert("❌ Gagal mengubah kata sandi: " + error.message);
            } else {
                alert("✅ Kata sandi berhasil diperbarui! Anda akan dialihkan ke halaman masuk.");
                // Keluar dari sesi lama dan kembali ke halaman utama
                await supabase.auth.signOut();
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
