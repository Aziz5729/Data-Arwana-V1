<!DOCTYPE html>
<html>
<head>
  <title>Update Password</title>
  <!-- Masukkan script CDN supabase-js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Masukkan Password Baru</h2>
  <input type="password" id="new-password" placeholder="Password Baru">
  <button onclick="updatePassword()">Update Password</button>

  <script>
    const supabase = supabase.createClient('https://uczqzarbuunjrkefdsdj.supabase.co', 'sb_publishable_3jk79pXdGHa88negFx1TGw_z2JnHnrO');

    async function updatePassword() {
      const newPassword = document.getElementById('new-password').value;
      
      const { data, error } = await supabase.auth.updateUser({
        password: newPassword
      });

      if (error) {
        alert("Gagal: " + error.message);
      } else {
        alert("Password berhasil diubah!");
        window.location.href = "index.html"; // Arahkan ke halaman utama
      }
    }
  </script>
</body>
</html>
